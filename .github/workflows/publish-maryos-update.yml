name: Publish MARYOS Update

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Private MARYOS source repository"
        required: true
        default: "yuzuchan2525/maryos"
        type: string
      source_ref:
        description: "Branch, tag, or commit to publish"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: maryos-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build Windows and publish to R2
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      R2_BUCKET: maryos-updates
      R2_PUBLIC_BASE: https://pub-9e098a93cbe24c8aa80191adf4ec99e2.r2.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out Online Services repository
        uses: actions/checkout@v7
        with:
          path: services

      - name: Check required secrets
        shell: pwsh
        env:
          MARYOS_SOURCE_TOKEN: ${{ secrets.MARYOS_SOURCE_TOKEN }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:MARYOS_SOURCE_TOKEN)) { $missing += "MARYOS_SOURCE_TOKEN" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) { $missing += "CLOUDFLARE_API_TOKEN" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) { $missing += "CLOUDFLARE_ACCOUNT_ID" }
          if ($missing.Count -gt 0) {
            throw "Missing repository secrets: $($missing -join ', ')"
          }

      - name: Check out private MARYOS source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.MARYOS_SOURCE_TOKEN }}
          path: maryos
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: maryos
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Validate version
        id: version
        working-directory: maryos
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid package.json version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing MARYOS $version"

      - name: Build Squirrel.Windows release
        working-directory: maryos
        shell: pwsh
        run: |
          npx electron-forge make --platform=win32 --arch=x64

      - name: Collect Squirrel.Windows files
        shell: pwsh
        run: |
          $make = Join-Path $env:GITHUB_WORKSPACE "maryos\out\make"
          if (!(Test-Path $make)) { throw "Forge output directory not found: $make" }

          $release = Get-ChildItem $make -Recurse -File | Where-Object { $_.Name -eq "RELEASES" } | Select-Object -First 1
          $nupkgs = @(Get-ChildItem $make -Recurse -File -Filter "*-full.nupkg")
          $setup = Get-ChildItem $make -Recurse -File -Filter "*-Setup.exe" | Select-Object -First 1

          if (!$release) { throw "RELEASES was not generated." }
          if ($nupkgs.Count -eq 0) { throw "No *-full.nupkg was generated." }
          if (!$setup) { throw "Setup.exe was not generated." }

          $r2 = Join-Path $env:GITHUB_WORKSPACE "publish\r2"
          New-Item -ItemType Directory -Force -Path $r2 | Out-Null
          Copy-Item $release.FullName (Join-Path $r2 "RELEASES") -Force
          foreach ($file in $nupkgs) { Copy-Item $file.FullName (Join-Path $r2 $file.Name) -Force }
          Copy-Item $setup.FullName (Join-Path $r2 $setup.Name) -Force

          Write-Host "R2 publish files:"
          Get-ChildItem $r2 | Format-Table Name, Length

      - name: Upload Squirrel.Windows feed to Cloudflare R2
        shell: pwsh
        run: |
          $r2 = Join-Path $env:GITHUB_WORKSPACE "publish\r2"
          foreach ($file in Get-ChildItem $r2 -File) {
            $object = "$env:R2_BUCKET/$($file.Name)"
            $contentType = if ($file.Name -eq "RELEASES") { "text/plain; charset=utf-8" } else { "application/octet-stream" }
            Write-Host "Uploading $($file.Name) -> R2:$object"
            npx --yes wrangler@latest r2 object put $object --file $file.FullName --remote --force --content-type $contentType
            if ($LASTEXITCODE -ne 0) { throw "R2 upload failed: $($file.Name)" }
          }

      - name: Build RC8 compatibility bridge and update native manifest
        shell: pwsh
        run: |
          $r2Release = Join-Path $env:GITHUB_WORKSPACE "publish\r2\RELEASES"
          $bridgeDir = Join-Path $env:GITHUB_WORKSPACE "services\squirrel\win32\x64"
          New-Item -ItemType Directory -Force -Path $bridgeDir | Out-Null

          $bridgeLines = @()
          foreach ($line in Get-Content $r2Release) {
            $trimmed = $line.Trim()
            if (!$trimmed) { continue }
            $parts = $trimmed -split '\s+'
            if ($parts.Count -lt 3) { throw "Unexpected Squirrel RELEASES line: $line" }
            $packageName = $parts[1]
            if ($packageName -notmatch '^https?://') {
              $packageName = "$env:R2_PUBLIC_BASE/$packageName"
            }
            $bridgeLines += "$($parts[0]) $packageName $($parts[2])"
          }
          Set-Content -Path (Join-Path $bridgeDir "RELEASES") -Value $bridgeLines -Encoding ascii

          $info = [ordered]@{
            format = "MARYOS-SQUIRREL-BRIDGE"
            version = 1
            feed = $env:R2_PUBLIC_BASE
            clientVersion = "${{ steps.version.outputs.version }}"
            generatedBy = "GitHub Actions"
          }
          $info | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $bridgeDir "FEED_INFO.json") -Encoding utf8

          $native = [ordered]@{
            format = "MARYOS-NATIVE-UPDATE-SERVICE"
            version = 1
            enabled = $true
            feed = $env:R2_PUBLIC_BASE
            currentClientVersion = "${{ steps.version.outputs.version }}"
            message = "MARYOS native application updates are delivered through the official Cloudflare R2 Squirrel.Windows feed."
          }
          $native | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE "services\native-update.json") -Encoding utf8

      - name: Publish Workers metadata through GitHub
        working-directory: services
        shell: pwsh
        run: |
          git config user.name "MARYOS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add native-update.json squirrel/win32/x64/RELEASES squirrel/win32/x64/FEED_INFO.json
          if (git diff --cached --quiet) {
            Write-Host "Workers metadata already up to date."
            exit 0
          }
          git commit -m "Publish MARYOS ${{ steps.version.outputs.version }} update feed"
          git push

      - name: Publish summary
        shell: pwsh
        run: |
          "## MARYOS ${{ steps.version.outputs.version }} published" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- R2 feed: $env:R2_PUBLIC_BASE" >> $env:GITHUB_STEP_SUMMARY
          "- Bucket: $env:R2_BUCKET" >> $env:GITHUB_STEP_SUMMARY
          "- Workers metadata committed to maryos-online-services" >> $env:GITHUB_STEP_SUMMARY
          "- Existing RC8 clients use the Workers RELEASES bridge; newer clients can use R2 directly." >> $env:GITHUB_STEP_SUMMARY
